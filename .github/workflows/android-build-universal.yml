
name: Build Diem Danh Hoc Phi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Extracting application source..."

          mkdir -p source app/src/main/assets/www

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

          INDEX_FILE=$(find source -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          WEB_ROOT=$(dirname "$INDEX_FILE")

          cp -R "$WEB_ROOT"/. app/src/main/assets/www/

          if [ ! -f app/src/main/assets/www/index.html ]; then
            echo "ERROR: Web assets were not copied!"
            exit 1
          fi

          echo "Web application copied successfully."

          mkdir -p app/src/main/java/com/diemdanh/hocphi
          mkdir -p app/src/main/res/values

      - name: Create Gradle settings
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DiemDanhHocPhi"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Create Android app configuration
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.diemdanh.hocphi'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.diemdanh.hocphi'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Create Android Manifest
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Điểm Danh & Học Phí"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      - name: Create Android theme
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFFF00</item>
                  <item name="android:statusBarColor">#1E3C72</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/diemdanh/hocphi/MainActivity.kt <<'EOF'
          package com.diemdanh.hocphi

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebSettings
          import android.view.View
          import android.graphics.Color

          class MainActivity : Activity() {

              private lateinit var webView: WebView

              @Suppress("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(30, 60, 114)
                  window.navigationBarColor = Color.BLACK

                  webView = WebView(this)

                  webView.setBackgroundColor(Color.WHITE)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      allowFileAccess = true
                      allowContentAccess = false
                      javaScriptCanOpenWindowsAutomatically = false
                      setSupportMultipleWindows(false)
                  }

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()

                  webView.isVerticalScrollBarEnabled = true
                  webView.isHorizontalScrollBarEnabled = true

                  setContentView(webView)

                  if (savedInstanceState == null) {
                      webView.loadUrl(
                          "file:///android_asset/www/index.html"
                      )
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  if (::webView.isInitialized) {
                      webView.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diem-Danh-Hoc-Phi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
